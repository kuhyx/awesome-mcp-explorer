# Mirrors the local gate exactly, so green-local means green-CI:
#   pnpm run lint      -> astro check && eslint .
#   pnpm run coverage  -> vitest, which fails below 100%
#   pnpm run build     -> astro check && astro build
#
# The dataset is NOT built here. Tests run against committed fixtures, and
# building it would need ~2,981 GitHub calls against a 1,000/hour limit for the
# built-in GITHUB_TOKEN.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: the action reads the pinned pnpm from
      # package.json's packageManager field, the same source run.sh honours
      # through corepack. One place to bump the version, and CI cannot drift to
      # a newer 10.x than a developer has locally.
      - uses: pnpm/action-setup@v4

      # Node comes from .nvmrc (the dependency-freshness pin, newest stable),
      # so CI and local cannot drift. package.json engines still allows >=24.
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version-file: .nvmrc

      # --frozen-lockfile: CI must fail on a lockfile that does not match
      # package.json rather than silently resolving something else.
      - run: pnpm install --frozen-lockfile

      - name: Lint (astro check + eslint)
        run: pnpm run lint

      - name: Shellcheck run.sh
        run: shellcheck run.sh

      - name: Tests + 100% coverage
        run: pnpm run coverage

      - name: Build
        run: pnpm run build
